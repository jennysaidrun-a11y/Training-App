{% from "icons.html" import icon %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>{% block title %}Bakery Training{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v={{ asset_v }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<header class="top">
  <div class="top-inner">
    <a class="brand" href="/">{{ icon("logo") }}<span>bakery training</span></a>
    {% set here = request.url.path %}
    <nav class="tabs" aria-label="Main">
      <a class="tab {{ 'on' if here == '/' or here.startswith('/me') else '' }}" href="/">{{ icon("learn") }}<span>Learn</span></a>
      <a class="tab {{ 'on' if here.startswith('/manage') else '' }}" href="/manage">{{ icon("manage") }}<span>Manager</span></a>
      <a class="tab {{ 'on' if here.startswith('/rules') else '' }}" href="/rules">{{ icon("rules") }}<span>Rules</span></a>
    </nav>
  </div>
</header>
<main class="{% block main_class %}{% endblock %}">
{% block body %}{% endblock %}
</main>
</body>
</html>
