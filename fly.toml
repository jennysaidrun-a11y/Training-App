# Fly.io settings for the online training app. Deployed by .github/workflows/fly-deploy.yml.
app = "united-bakery-training"
primary_region = "sjc"

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Turns off when nobody is using it and starts again on the next visit,
  # so it only costs while it runs.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
