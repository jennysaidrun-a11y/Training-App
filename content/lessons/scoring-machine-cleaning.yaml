questions:
- q: Which bucket has the food safe sanitizer?
  choices:
  - The red labeled bucket
  - The unlabeled middle bucket
  - The yellow labeled bucket
  answer: 0
  why: The red labeled bucket is sanitizer, the unlabeled one is water, and the yellow one is soap.
  at: 20
  after_section: 0
- q: What must you do before you start cleaning the scoring machine?
  choices:
  - Slow the belt down
  - Make sure the machine is stopped and turned off
  - Wipe the knives while it runs
  answer: 1
  why: Cleaning a machine that is running or has power can get you cut or caught, so it must be stopped
    and turned off first.
  after_section: 0
- q: How do you wipe a scoring knife?
  choices:
  - Wipe along the sharp edge
  - Gently wipe the flat sides and don't touch the sharp edges
  - Pull the towel across the blade fast
  answer: 1
  why: Wiping only the flat sides keeps your hands away from the sharp edge.
  at: 30
  after_section: 1
- q: Asiago was made today. What extra step do the scoring knives need?
  choices:
  - None, sanitizer is enough
  - A second pass with Foam Safe (yellow bucket)
  - Just a water rinse
  answer: 1
  why: Asiago contains cheese, an allergen (milk), so the extra Foam Safe pass helps keep it from getting
    onto the next product.
  after_section: 1
- q: In what order do you wipe the machine surfaces?
  choices:
  - Sanitizer, water, Foam Safe
  - Foam Safe, water, sanitizer
  - Water, sanitizer, Foam Safe
  answer: 1
  why: Foam Safe cleans, water rinses, and sanitizer goes last on the clean surface.
  at: 55
  after_section: 2
