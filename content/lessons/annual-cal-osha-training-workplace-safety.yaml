- heading: What is an IIPP?
  text: 'Employers are required to provide a safe and healthful work environment.


    The Injury and Illness Prevention Program contains all the health and safety policies that are implemented.


    As an employee you have the right to:

    A safe workplace free from recognized hazards

    Receive training on hazards associated with your job

    Know how to control the hazards of your job

    Report workplace hazards without fear of retaliation.

    '
  images:
  - /media/attached-20261006231113-3730b9.jpeg
- heading: As an employee, you should
  text: 'Follow safe work practices, including the use of applicable PPE

    Be familiar with the  IIPP and its location

    Know the potential health and safety hazards of your job and how to protect yourself

    Know how to report unsafe work conditions

    Report and work-related injury or illness to your supervisor

    Know what to do in an emergency

    Correct unsafe conditions within your authority

    If you are unclear about your responsibility, ask your supervisor.

    '
  images:
  - /media/attached-20261006231113-62313b.jpg
- heading: IIPP Location
  text: 'United Bakery’s IIPP is in the front office inside a white binder in the paperwork area.

    '
  images:
  - /media/attached-20261006231113-0b0eaa.png
- heading: Code of safe practices
  text: 'General Safety Rules: Horseplay, fighting, and working while impaired by fatigue or drugs is
    strictly forbidden.


    Personal Protective Equipment (PPE): All employees are required to wear proper PPE depending on the
    tasks.


    Housekeeping: Keeping walkways, general areas and stairs clear of trash or debris


    Equipment Safety: Ensure all equipment is safe, inspecting tools and equipment, securing compressed
    gas, etc.


    Reporting: Report all broken, damaged or unsafe conditions immediately. Do not work in hazardous conditions.

    '
  images:
  - /media/attached-20261006231113-30c564.jpg
- heading: Personal Protective Equipment
  text: 'Personal protective equipment are safety gear or clothing designed to protect workers from various
    workplace hazards. They can protect you from physical, electrical, biological or chemical hazards.


    Each job duty may have PPE depending on the hazards presented in the tasks. You will be trained on-the-job
    what are the requirements by your trainer.


    PPE can be food safety or personal safety based.


    Some PPE are not optional, they are REQUIRED.

    '
  images:
  - /media/commons-20261006234044-2311f4.jpg
- heading: Safety-related personal protective equipment requirements
  text: 'All employees

    General safety - Closed toe footwear, long pants

    When using compressed air – ear plugs/muffs and safety glasses


    Bread production

    Cuts/penetrations – Cut-resistant gloves


    baking

    Hot surfaces – Baking pads, cotton gloves

    Cuts/penetrations – Cut-resistant gloves


    Slicing/packaging

    Impacts – Bump cap

    Cuts/penetrations – Cut-resistant gloves

    Chemicals – Rubber chemical-resistant gloves

    Cold environments – Freezer jackets, gloves

    '
  images:
  - /media/attached-20261006231113-db3599.png
  - /media/attached-20261006231113-b31f56.jpeg
  - /media/attached-20261006231113-c794a8.jpeg
  - /media/attached-20261006231113-85fb26.jpeg
  - /media/attached-20261006231113-4de525.png
- heading: Safety personal protective equipment requirements
  text: 'Maintenance

    Harmful foreign objects – Safety glasses

    Cuts/penetrations – Work gloves

    Impact – Bump caps

    Electrical – Electrical gloves, insulated tools

    Noise – Ear muffs/plugs


    sanitation

    Impact  - Bump cap

    Chemicals – Rubber chemical-resistant gloves, face shield, chemical-resistant apron

    Noise – Ear muffs/plugs

    '
  images:
  - /media/attached-20261006231113-a4251f.jpeg
  - /media/attached-20261006231113-1b0db2.jpeg
