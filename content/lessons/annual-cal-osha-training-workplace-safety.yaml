- heading: First aid kits, injuries and near misses
  text: 'Any injury or near miss must be reported immediately to supervisor and management

    DON''T WAIT UNTIL THE NEXT DAY!

    Even near-misses need to be reported to prevent the accident from happening again.

    It is essential to obtain medical attention to avoid further injuries


    The first aid kit is located by slicing and inside of the office. Ask your supervisor to access it
    for any first aid supplies


    If you need a band-aid:

    Ask your supervisor or management to get you a band aid

    At the end of the day, you need to show your supervisor or management that you''re still wearing it
    to verify it did not go missing

    '
  images:
  - /media/attached-20261006231113-6035b4.jpg
- heading: Accident Investigations
  text: 's

    '
  images:
  - /media/attached-20261006231113-f32bcd.jpg
- heading: Emergency Evacuations
  text: 'Fire evacuation

    When a fire is active inside, staff will need to evacuate outside of the facility immediately.

    Use the closest exit depending on your location


    Ammonia evacuation

    An ammonia leak is inside or outside of the facility. The source of the ammonia leak must be identified
    and then evacuate appropriately

    If the leak is outside, stay inside

    If the leak is inside, go outside

    Wait for directions before evacuating

    '
  images:
  - /media/attached-20261006231113-4ac9bb.jpeg
  - /media/attached-20261006231113-c10c1a.jpeg
- heading: Fire evacuation
  text: 'Upon hearing the alarm, stop the product line in your area and start evacuating to your closest
    exit

    Do not retrieve your personal belongings – your safety comes first

    Go to the evacuation meeting spot and wait until further instructions

    Only authorized trained personnel may use the fire extinguisher

    Call 911 if needed

    '
  images:
  - /media/commons-20261006234044-9a86cd.jpg
- heading: Evacuation Map
  text: 'There are two meeting areas:

    Front: Front of parking lot at concrete wall

    Back: Back lawn outside of fence


    You will exit whichever side is closest to you


    DO NOT leave until you have been told directly by Management that it is safe to go back inside.

    '
  images:
  - /media/commons-20261006234044-528604.jpg
- heading: Evacuation Map
  text: 'Meeting spot A: Front of the concrete wall


    Meeting spot B: Backyard outside of the gate

    '
  images:
  - /media/commons-20261006234045-92da51.jpg
- heading: Forklift safety for pedestrians
  text: 'Only trained and certified employees may drive forklifts

    Always listen to the honk of forklifts to be aware of their presence

    Always look around when crossing in a forklift zone

    Make contact with the forklift driver when possible, to ensure they see you

    Wait for the forklift to pass before crossing, do not act impulsively

    NEVER walk under raised loads

    Immediately report unsafe conditions to Management

    '
  images:
  - /media/commons-20261006234045-37a94b.jpg
- heading: Hearing protection
  text: 'Noise levels in the facility are below the protection level required by OSHA. However, it is
    strongly recommended that team members wear hearing protection.


    Metal detectable earplugs are available in the handwash near the hairnets.

    If your ear plugs go missing, immediately report it to QA to ensure they are not in product.

    Store earplugs in your hair net cubby when not in use


    ALL TEAM MEMBERS in the room/area where compressed air is used MUST wear earplugs.

    Compressed air is extremely loud!

    '
  images:
  - /media/commons-20261006234045-2ac726.jpg
- heading: Ergonomics
  text: 'What is ergonomics?

    Ergonomics is the study of people in their work environment


    Ergonomic policies are in place to:

    Reduce physical strain

    Prevent injuries

    Improve worker comfort and efficiency


    If you have any suggestions to improve ergonomics, do not hesitate to submit your comments to Management

    '
- heading: Common ergonomic issues
  text: 'Common ergonomic issues that may lead to injury includes

    Repetitive motions

    Awkward motions (bending, twisting)

    Forceful exertions (carrying, lifting heavy loads)

    Static postures (fixed positions for a long time)

    '
- heading: Proper lifting
  text: 'Lift with your legs, not your backs

    Do not twist your body when lifting

    Keep the load close to your body when lifting

    Get help with heavier loads – do not lift heavy loads alone

    When possible, use equipment to help assist, like a dolly, pallet jack or a cart.

    '
- heading: Task rotations and breaks
  text: 'Repeating one task for a long time may cause physical strain

    Supervisors are trained to constantly rotate employees to do different tasks to avoid repetitiveness

    Employees are courage to stretch when needed, including before, during and after work.

    '
- heading: Hot and cold temperatures
  text: 'In this facility, there are hot and cold climates


    In hot climates, practice heat illness prevention, which includes:

    Drinking plenty of water

    Rotate to cool areas periodically

    Use fans to keep cool

    Step into a cooler area when you do not feel well


    In cold climates, make sure you wear cold weather gear such as gloves and jackets

    '
- heading: Good posture
  text: 'Good posture minimized physical strains and reduces the risk of musculoskeletal injuries

    Avoid excessive twisting and bending

    Keep your arms as close to your body as possible

    Avoid bending your body more than 30 degrees when possible

    The more you bend over, the more the body is at risk

    '
- heading: Ergonomic PPE
  text: 'Ergonomic PPE provided in this facility includes:

    Back braces – This helps support and stabilize your back

    Ear plugs – To protect your ears from hearing damage

    Knee pads – To cushion your knees while crouching or kneeling


    Employees are provided these PPE as needed

    If you have any suggestions, please feel free to mention it to Management

    '
- heading: Lock Out Tag Out
  text: 'Lockout tagout (LOTO) is a crucial safety procedure used in workplaces to ensure that dangerous
    machines are properly shut off and cannot be restarted before maintenance or repair work is finished.


    Equipment that is identified to be locked out must be adequately isolated from energy source to avoid
    accidents when undergoing disinfecting or maintenance must be adequately isolated from energy to avoid
    accidents.


    Do not perform any sanitation, adjustments or maintenance on equipment unless you are trained in LOTO


    You always have to complete the appropriate paperwork before and after applying LOTO.

    '
- heading: What is hazardous energy?
  text: 'Equipment that is identified to be locked out must be adequately isolated from energy source
    to avoid accidents when undergoing disinfecting or maintenance must be adequately isolated from energy
    to avoid accidents.


    Lock out tag out keeps you safe

    As you are working, no one can turn on the machine suddenly.

    The machine can only turn on when you are ready and finished.

    LOTO warns other to prevent others from turning on the equipment.

    '
- heading: Lock Out Tag Out
  text: 'When to use LOTO?

    When preparing, maintaining, or repairing machinery or equipment

    If the machine needs to move during operation, you must minimize the hazard.

    When working on electric circuits

    When cleaning or adjusting dangerous machines


    LOTO methods

    Plug boxes

    Secure a power switch

    Emergency stop

    '
- heading: Lock Out Tag Out Procedures
  text: '1. Prepare for a shut down, identify what procedure and hazards are (electrical, etc.)

    2. Notify all affected employees in the area

    3. Properly shut down the machine

    4. Isolate the machine from the energy source and apply lock out tag out device

    5. Check for stored energy

    6. Proceed to verify the lock out on the form 1115-HSE-F-10 Lock Out Tag Out

    7. Conduct work needed

    8. When finished, notify all affected employees, release the lock out and plug back in the equipment
    to its original state.

    '
- heading: Hazard Communication Program
  text: 'Chemical control procedures

    '
- heading: Hazard communication program
  text: 'Only use chemicals you are authorized and trained to use

    Chemicals in secondary containers, like spray bottles, must be labeled at all times.

    Safety Data Sheets (SDSs) are available by the front office, maintenance shop and wash room

    The SDS binder for cleaning chemicals is in the blue binder in front of the washroom that is accessible
    by every employee.

    Inside the SDS is information about the hazards, properties and safety precautions

    If someone goes to the emergency room because of a chemical exposure, take the SDS binder with you
    for the doctor to review.


    Information in a SDS includes:

    Material Identification

    Name, address, telephone number, chemical name, formula and trade name, list of hazardous ingredients

    Physical data

    Physical description, color, odor, pH, etc.

    Health Hazard Data

    Health effects, permitted exposures and first aid/emergency procedures

    Lead Spill Procedure

    Cleaning and disposal methods

    Special precautionary information

    PPE required, ventilation requirements, medical surveillance, proper storage, personal hygiene

    '
- heading: Chemical Hazard Pictograms
  text: 'If a chemical is known to have a chemical hazard upon exposure, the container will depict a pictogram.
    These symbolize what hazard they have.

    '
- heading: Chemical Hazard Pictograms
  text: 'In our facility, all chemicals have the “corrosive” pictogram. This means the undiluted chemical
    will damage materials and human tissue upon contact. Do NOT touch undiluted chemicals and wear the
    proper PPE!

    '
- heading: Eyewash and shower stations
  text: 'Eyewash and shower stations are available throughout the facility if you need to rinse chemicals
    off your body.


    Eye wash

    Forklift charging room

    Ammonia room (inside and outside)

    Washroom


    Shower

    Washroom

    Ammonia room (outside and inside)


    To use the eyewash or shower station, pull the lever or push the pedal to run the water

    '
- heading: Eyewash and shower stations
  text: 'Upon chemical exposure, you must rinse your body or eyes for 15 minutes minimum.

    If you use the eyewash, you must force your eyes open while the water flushes them.

    Contact emergency help if needed as the affected employee is rinsing.

    '
- heading: PPE required when handling chemicals
  text: 'When using Foam Safe, Enviroguard or F-29 to clean, you must protect your hands by wearing rubber
    gloves.

    You must use your assigned rubber cleaning gloves.

    All rubber cleaning gloves must be hung in the washroom when not in use.

    You may write your name on your rubber glove, but make sure it’s in good condition. If the glove is
    broken, ask Management for a new glove.

    Rinse the glove between different chemical use.


    Only authorized individuals may replace concentrated containers of these chemicals. A face shield,
    chemical-resistant apron and rubber gloves must be worn.


    Additional PPE may be required depending on the chemical used. Follow all manufacturer’s instructions.

    '
- heading: Bloodborne Pathogens
  text: 'Bloodborne pathogens are microorganisms that are present in blood and can cause diseases. They
    are spread through blood.


    Some well-known examples of bloodborne pathogens include human immunodeficiency virus (HIV), and Hepatitis
    B and C.


    Bloodborne pathogens can be life threatening.

    '
- heading: Bloodborne Pathogens
  text: 'Responding to Injuries

    '
- heading: Indoor Heat Illness Prevention Plan (IHIPP)
  text: 'a

    '
- heading: United Bakery’s Heat Control Measures
  text: 'Access to cool down areas when needed (temperature controlled rooms)

    Water fountains available to employees around the facility

    Employees are rotated to work in cool temperature areas, if possible

    Fans are placed through out the facility for air rotation

    '
- heading: United Bakery’s Heat Control Measures
  text: 'In hotter weather, employees may wear short sleeve t-shirts

    Cooling towels may be requested (ask Management)

    Schedule production earlier to avoid heat in the afternoon and evening

    '
- heading: Drink water to keep hydrated
  text: 'During hotter weather, keep hydrated to make up for the sweat loss.


    Drink water as you need, but it is recommended to drink no more than 4 cups of water per hour.


    Water is available throughout the facility:

    Drinking fountains are available for all employees to use

    Employees can bring reusable water bottles to their department, but must be placed away from production
    equipment.

    '
- heading: How to monitor the temperature
  text: 'Clocks with temperatures readers are placed around the facility for all employees to see the
    inside temperature.


    There are also specifically placed thermometers in the designated sections

    '
- heading: Signs of heat stress
  text: 'Heavy sweating

    Faintness, dizziness or fatigue

    Weak, rapid pulse

    Low blood pressure or muscle cramps

    Nausea

    Cool, moist skin with goosebumps in the heat

    Headache

    '
- heading: What do you do if you have heat stress?
  text: 's

    '
- heading: Signs of heat stroke
  text: 'Very high body temperature

    Confusion, altered mental status

    Slurred speech

    Loss of consciousness

    Hot, dry skin or profuse sweating

    Seizures

    '
- heading: What do you do if you have a heat stroke?
  text: 'a

    '
- heading: Ice sheets
  text: 'If someone is affected by a heat stroke, move them immediately to the packaging room and lay
    them down on the cool floor.


    There is a prepared bedsheet kit with directions by the packaging room door to wet with iced water.


    Lay the wet, cold bedsheets on top of the personnel affected by the heat stroke until further help
    comes along.

    '
- heading: Emergency services
  text: 'a

    '
- heading: Employee heat prevention
  text: 'a

    '
- heading: Acclimatization
  text: 'New employees may need to acclimate to working in higher temperatures.

    This may take up to 14 days.

    All team members should monitor new employees working in hotter areas to ensure their safety.

    New employees may freely access cool water or cooling areas as needed.

    '
- heading: Workplace Violence Program
  text: 'a

    '
- heading: What is workplace violence?
  text: 'Per Labor Code 6401.9 – “Any act of violence or threat of violence that occurs in a place of
    employment.


    Type 1

    Violence committed by a person who has no legitimate business at the work site.


    Type 2

    Violence directed at employees by customers, clients, visitors, etc.


    Type 3

    Violence committed against an employee by a present or former employee.


    Type 4

    Violence committed a person who does not work there but has a personal relationship with an employee

    '
- heading: Types of violence
  text: 'Physical

    Grabbing, Pushing, Slapping, Kicking, Scratching, Hitting, Bitten, Knifed, Shot


    Verbal

    Verbal assault, Verbal abuse, Verbal harassment, Intimidation, Defamation, Bullying


    Threats

    Threaten with weapons, Bomb treat, Verbal threats, Any other physical threats


    Outside violence

    Robbery, Bomb, Animal attack


    Property

    Vandalism, Arson

    '
- heading: If emergency assistance is needed (fire, police or medical), CALL 911!!!
  text: 'Cellphone

    Supervisors and authorized personnel who carry their cellphone should dial 911 to reach emergency
    help


    Company phone

    Any employee may use the company phone to call 911 if needed.

    '
- heading: Workplace Violence Program
  text: 'Treatment will be timely and appropriate.

    Post-trauma follow up counseling may be provided to pertaining staff.

    Any employees who are injured from a workplace violence incident will be treated under United Bakery’s
    worker’s compensation program.

    '
- heading: During violent incidents
  text: 'Immediately notify your supervisor or a member of Management.

    Try not to engage or put yourself in dangerous situations.

    Evacuate from the area, if possible.

    '
- heading: Ways to communicate to Management
  text: 'Speak directly to a member of Management

    Speak to your supervisor, who will relay the information to Management

    Anonymous report box in the front office foyer

    Anonymous report QR code link to an online form

    '
- heading: Reporting
  text: 'United Bakery maintains the following:

    Workplace Violence Reports

    Workplace Violence Logs


    All employees must report any violent incidents to Management.

    Follow up reports, investigations and records are available to affected employees.

    '
- heading: Responsibilities of all employees
  text: 'Do not let any strangers inside the facility.

    Communicate to your supervisor or Management team of any suspicious activities or threats.

    Do not instigate violent situations.

    Do not interject yourself in violent situations.

    Immediately contact emergency services, if needed.

    '
- heading: Responsibilities of Management
  text: 'Annual review of the Workplace Violence Program, or after a violent situation to ensure the adequacy
    of the program.

    Maintain a safe working environment free of fear or reprisal.

    Ensure escape routes, safe rooms, and other safety mechanisms are adequate.

    Implement corrective actions as needed.

    Workplace violence training for all employees.

    All reporting, investigations and record keeping are carried out appropriately.

    Any disciplinary actions are carried out appropriately.

    Monthly inspections will include facility hazard identifications.

    '
- heading: Ammonia Awareness and Emergency Response Training
  text: 'Provided by Resource Compliance

    '
- heading: Properties of Ammonia
  text: 'Color: Colorless gas and liquid


    Boiling Point: -28.1ºF

    This means ammonia will evaporate if it leaves the system. It will not remain a liquid.


    Vapor Pressure: 93 psig @ 60ºF


    Vapor Density: 0.60

    This means vapor ammonia will rise instead of staying at ground level. This is a good thing!


    Solubility: Highly Soluble in Water (high affinity)

    This is good because water will help remove ammonia from affected areas.


    Smell: (Most recognizable) Extremely pungent, irritating odor

    '
- heading: First Aid Procedures
  text: 'Health Effects

    Irritation, chemical burns, eye damage and fatal in high concentrations.


    Inhalation - First Aid

    Remove from exposure area. If breathing has stopped, administer artificial respiration.


    Skin/Eye Contact - First Aid

    Flush with water for at least 30 minutes at an eyewash/shower station and contact a physician.

    '
- heading: Exposure Limits
  text: 'Permissible Exposure Limit (PEL): 25 ppm

    Employees may spend the entire work day in this concentration.

    No harm will come to a person if the concentration of ammonia stays under 25 ppm.

    '
- heading: Exposure Limits
  text: 'Short-Term Exposure Limit (STEL - 15 minutes): 35 ppm

    The short-term exposure limit is different than the permissible exposure limit.

    Employees may only work in this atmosphere for fifteen minutes, but then they must leave the area
    for one (1) hour.

    '
- heading: Exposure Limits
  text: 'Immediately Dangerous to Life or Health (IDLH): 300 ppm

    This is the concentration where employees will start to face severe health implications.

    Review the next slide to see how different concentrations will affect the human body.

    '
- heading: Exposure Effects
  text: '100 ppm: irritation to the mucous membranes of the nose, throat and lungs

    400 ppm: throat irritation and may destroy mucous surfaces from prolonged exposure

    5,000 ppm: breathing this concentration can cause sudden death

    30,000 ppm: skin will start to burn and blister after a few seconds of exposure

    '
- heading: Detecting Ammonia
  text: 'While ammonia can be dangerous in higher concentrations, it is not harmful if it is below 25
    ppm.


    Most people can smell ammonia as low as 5 ppm.

    '
- heading: Evacuation and Notification
  text: 'Report any leaks to your supervisor

    Alarms alert all employees of a leak

    Evacuate or shelter in place based on instructions from management

    '
- heading: Evacuation and Notification
  text: 'Use windsocks to avoid the path of wind

    Wait to be dismissed by the Incident Commander

    '
questions:
- q: You see a hazard on your line. Can you get in trouble for reporting it?
  choices:
  - Yes, if it slows down production
  - No, you have the right to report hazards without fear of retaliation
  - Only if you report it to someone other than your supervisor
  answer: 1
  why: Your rights under the IIPP include reporting workplace hazards without fear of retaliation.
  after_section: 4
- q: Where is United Bakery’s IIPP kept?
  choices:
  - In the maintenance shop
  - In the front office, in a white binder in the paperwork area
  - In the blue binder by the washroom
  - Posted by the time clock
  answer: 1
  why: The IIPP is in a white binder in the paperwork area of the front office.
  after_section: 4
- q: Anyone using compressed air must wear which PPE?
  choices:
  - Bump cap only
  - Ear plugs/muffs and safety glasses
  - Freezer jacket
  - Cotton gloves
  answer: 1
  why: The PPE list says all employees using compressed air wear ear plugs/muffs and safety glasses.
  after_section: 8
- q: You almost got hit by a falling tray, but you weren't hurt. What should you do?
  choices:
  - Nothing, because no one was hurt
  - Report it the next day
  - Report the near miss to your supervisor and management right away
  answer: 2
  why: Near misses must be reported right away so the accident doesn't happen again.
  after_section: 9
- q: The fire alarm goes off. What do you do first?
  choices:
  - Get your phone and jacket from your locker
  - Stop the product line in your area and head to your closest exit
  - Grab the fire extinguisher
  - Wait at your station for a supervisor
  answer: 1
  why: Stop your line and go to the closest exit; don't stop for belongings.
  after_section: 14
- q: There is an ammonia leak outside the building. What should you do?
  choices:
  - Go outside right away
  - Stay inside and wait for directions
  - Go to the ammonia room
  answer: 1
  why: If the leak is outside, stay inside and wait for directions before evacuating.
  after_section: 14
- q: A forklift is coming toward you in the warehouse. What is the safest thing to do?
  choices:
  - Walk quickly under the raised load
  - Make eye contact with the driver and wait for the forklift to pass
  - Wave and keep walking
  answer: 1
  why: Make sure the driver sees you, wait for the forklift to pass, and never walk under raised loads.
  after_section: 15
- q: One of your earplugs is missing during your shift. What do you do?
  choices:
  - Get a new pair and keep working
  - Report it to QA right away
  - Tell a coworker at break
  answer: 1
  why: QA needs to know right away to make sure the earplug isn't in the product.
  after_section: 16
- q: Which is the right way to lift a heavy case of flour?
  choices:
  - Bend at the waist and twist to set it down
  - Lift with your legs, keep it close, and get help or a cart if it's heavy
  - Hold it out away from your body
  answer: 1
  why: Lift with your legs, keep the load close, don't twist, and get help or equipment for heavy loads.
  after_section: 19
- q: The sheeter needs cleaning, but you are not trained in LOTO. What should you do?
  choices:
  - Turn it off at the switch and clean it quickly
  - Don't clean or adjust it; get a LOTO-trained person
  - Ask a coworker to watch the switch while you clean
  answer: 1
  why: Only people trained in LOTO may do sanitation, adjustments or maintenance on equipment.
  after_section: 27
- q: In the LOTO steps, when do you tell affected employees?
  choices:
  - Only after the work is done
  - Before shutting down, and again when finished before releasing the lockout
  - Never, because the tag tells them
  answer: 1
  why: Affected employees must be told before the lockout is applied and after it is removed.
  after_section: 27
- q: You fill a spray bottle with diluted cleaner. What must be on the bottle?
  choices:
  - Nothing, since it's diluted
  - A label, at all times
  - Your name only
  answer: 1
  why: Chemicals in secondary containers like spray bottles must be labeled at all times.
  after_section: 29
- q: Where is the SDS binder for cleaning chemicals?
  choices:
  - In the blue binder in front of the washroom
  - In the white IIPP binder
  - In the forklift charging room
  answer: 0
  why: The cleaning chemical SDS binder is the blue binder in front of the washroom, open to every employee.
  after_section: 29
- q: What does the “corrosive” pictogram on our chemicals mean?
  choices:
  - The chemical is safe to touch
  - The undiluted chemical will damage materials and skin on contact
  - The chemical can catch fire
  answer: 1
  why: Corrosive means the undiluted chemical damages materials and human tissue, so don't touch it and
    wear your PPE.
  after_section: 31
- q: Cleaner splashes in your eye. At the eyewash, what must you do?
  choices:
  - Rinse for a few seconds, then rub your eye
  - Hold your eyes open while the water flushes them
  - Keep your eyes closed under the water
  answer: 1
  why: You must force your eyes open so the water can flush the chemical out.
  after_section: 33
- q: Your rubber cleaning glove has a tear. What should you do?
  choices:
  - Keep using it until the shift ends
  - Ask Management for a new glove
  - Tape it and keep working
  answer: 1
  why: Gloves must be in good condition; ask Management for a new one if it's broken.
  after_section: 34
- q: Which of these is a bloodborne pathogen?
  choices:
  - Hepatitis B
  - Flour dust
  - Ammonia
  answer: 0
  why: Hepatitis B and C and HIV are well-known bloodborne pathogens spread through blood.
  after_section: 35
- q: It's hot by the ovens and you start to feel unwell. What can you do?
  choices:
  - Keep working until break
  - Go to a cool-down area (temperature controlled room) and tell your supervisor
  - Leave the building without telling anyone
  answer: 1
  why: You can use a cool-down area whenever you need it, and step into a cooler area when you don't feel
    well.
  after_section: 41
- q: Where can you keep your reusable water bottle?
  choices:
  - On top of the mixer
  - In your department, away from production equipment
  - On the packaging conveyor
  answer: 1
  why: Water bottles are allowed in your department but must be kept away from production equipment.
  after_section: 41
- q: A coworker is confused, has slurred speech and very hot skin. What could this be?
  choices:
  - Normal tiredness
  - Signs of heat stroke
  - A cold
  answer: 1
  why: Confusion, slurred speech and very high body temperature are signs of heat stroke.
  after_section: 44
- q: Where is the ice sheet kit for heat stroke?
  choices:
  - By the packaging room door
  - In the front office
  - In the ammonia room
  answer: 0
  why: The prepared bedsheet kit with directions is by the packaging room door.
  after_section: 46
- q: How long can it take a new employee to get used to working in the heat?
  choices:
  - 1 day
  - Up to 14 days
  - 6 months
  answer: 1
  why: Getting used to the heat can take up to 14 days, so new employees need to be watched closely.
  after_section: 49
- q: A former employee comes back and threatens a coworker. What type of workplace violence is this?
  choices:
  - Type 1
  - Type 2
  - Type 3
  - Type 4
  answer: 2
  why: Type 3 is violence against an employee by a present or former employee.
  after_section: 51
- q: You don't carry a cellphone and someone is hurt in a fight. Can you call 911?
  choices:
  - No, only supervisors can call
  - Yes, any employee may use the company phone to call 911
  - Only after Management says so
  answer: 1
  why: Any employee may use the company phone to call 911 if needed.
  after_section: 53
- q: You want to report a threat but don't want to give your name. What can you use?
  choices:
  - The anonymous report box in the front office foyer or the QR code form
  - The SDS binder
  - Nothing, all reports need your name
  answer: 0
  why: You can report anonymously with the box in the front office foyer or the QR code online form.
  after_section: 56
- q: Someone you don't know asks you to let them in the back door. What do you do?
  choices:
  - Let them in if they seem friendly
  - Don't let them in, and tell your supervisor or Management
  - Prop the door open for them
  answer: 1
  why: Don't let strangers inside, and report suspicious activity to your supervisor or Management.
  after_section: 58
- q: If ammonia vapor leaks, where does it go?
  choices:
  - It rises instead of staying at ground level
  - It stays on the floor
  - It turns into a puddle of liquid
  answer: 0
  why: Ammonia vapor is lighter than air (vapor density 0.60), so it rises.
  after_section: 61
- q: What is the Permissible Exposure Limit (PEL) for ammonia over a work day?
  choices:
  - 5 ppm
  - 25 ppm
  - 300 ppm
  - 5,000 ppm
  answer: 1
  why: Cal/OSHA sets the ammonia PEL at 25 ppm averaged over the work day; 35 ppm is the 15-minute short-term
    limit.
  after_section: 65
- q: During an ammonia leak, what helps you stay out of the path of the gas?
  choices:
  - The windsocks
  - The fire extinguisher
  - The SDS binder
  answer: 0
  why: Windsocks show the wind direction so you can stay out of the path of the ammonia.
  after_section: 69
- q: After an ammonia evacuation, when can you leave the meeting area?
  choices:
  - As soon as you can't smell ammonia
  - When the Incident Commander dismisses you
  - After 15 minutes
  answer: 1
  why: Wait to be dismissed by the Incident Commander.
  after_section: 69
