# Training plans: what a new person does each day, in order. Managers edit these on
# Manager > Plans. Each item is a lesson (by id) or a hands-on task a trainer signs off.
- id: d4f6f1b11d
  name: Warehouse/Packaging
  roles: []
  days:
  - title: Intoduction to Paperwork and Packaging Line
    items:
    - key: 228a84fd51
      task: Paperwork Shadow
      note: '-As many paperwork changes in the day have them watch and explain all, they will NOT be writing
        themselves

        -scheduling for bread

        -allergen'
      minutes: 45
    - key: 0fdbdb3e7a
      task: Packaging Line Practice
      note: "-20-30mins: start off with their own box and product to practice on the side to get a rhythm\n\
        -Stay on packaging line to practice boxing, only pull from line when filling out new forms\n-Products\
        \ to see\n   -Sams club\n   -Boule\n   -Rosemary\n-scoring pattern\n-supplies (tape, hand plastic\
        \ film, labeling)\n-hand labels"
      minutes: 120
    - key: dba37e12a1
      task: Box Erector Refill
      note: "-use pallet jack to refill boxes \n-maintenance and change of configuration"
  - title: Paperwork + Packaging Line + Box Erector Introduction
    items:
    - key: 441057ab56
      task: Paperwork Shadow
      note: -As many paperwork changes in the day have them watch and explain all, they will NOT be writing
