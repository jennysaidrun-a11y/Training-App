      minutes: 120
    - key: 638267296a
      task: Box Erector Introduction
      note: "-get introduction to machine and go over\n   -Adjusting box sizes\n   -Different boxes\n\
        \   -how the machine works\n   -how to troubleshoot common issues\n      -tape change and tape\
        \ issue\n      -vacuum issue\n      -clearing codes\n      -emergency stop"
