# Checks every cited rule against the government sources each night and saves
# the result (content/rules_status.json), so the app knows what changed even
# when no one has it open.
name: Nightly rules check
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - run: python -m trainer.rules
      - name: Save the result
        run: |
          git config user.name "rules-check"
          git config user.email "rules-check@users.noreply.github.com"
          git add content/rules_status.json
          git diff --cached --quiet || (git commit -m "Nightly rules check" && git push)
